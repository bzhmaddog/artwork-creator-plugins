[package]
name = "halftone"
version = "1.0.1"
edition = "2024"
description = "Example Artwork Creator plugin: a halftone effect"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin SDK at an app release tag: raise it on purpose, then
# `cargo update -p artwork-plugin-sdk@<old version>`.
artwork-plugin-sdk = { git = "https://github.com/bzhmaddog/artwork-creator-app", tag = "v0.17.0" }
