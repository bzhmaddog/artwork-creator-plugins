[package]
name = "halftone"
version = "1.1.0"
edition = "2024"
description = "Example Artwork Creator plugin: a halftone effect"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin SDK at an app release tag: raise it on purpose, then
# `cargo update -p artwork-plugin-sdk@<old version>`.
# TEMPORARY, SDK 0.5.0 (parameter groups) at a commit of the app's main until v0.19.0 is
# tagged: `tag = "v0.19.0"` in place of `rev` before releasing. To build against the local
# SDK, make sdk-local.
artwork-plugin-sdk = { git = "https://github.com/bzhmaddog/artwork-creator-app", rev = "f83dd09a65a5febd4ea36627d2dc48cdb973b900" }
