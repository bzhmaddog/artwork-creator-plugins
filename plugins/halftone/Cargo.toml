[package]
name = "halftone"
version = "1.1.0"
edition = "2024"
description = "Example Artwork Creator plugin: a halftone effect"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin SDK at an app release tag: raise it on purpose, then
# `cargo update -p artwork-plugin-sdk@<old version>`.
# TEMPORARY, for trying SDK 0.5.0 (parameter groups) before the app releases it: put back
# `{ git = "https://github.com/bzhmaddog/artwork-creator-app", tag = "v0.19.0" }` before releasing.
artwork-plugin-sdk = { path = "../../../artwork-creator-app/plugin-sdk" }
