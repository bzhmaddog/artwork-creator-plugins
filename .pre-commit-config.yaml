# Git hooks, run by pre-commit (https://pre-commit.com), from requirements-dev.txt:
#   make hooks                         # once per clone (or after moving it): installs the hook
#   make pre-commit                    # every hook on every file
# On commit: file hygiene, ruff (lint, with fixes, and format), mypy, cargo fmt, the
# manifest/index validation, a Cargo.lock with the SDK from GitHub, no copied code within a
# plugin (make duplication), and the Python and Rust tests under coverage (make coverage):
# fails under fail_under in .coveragerc, or when less than 80% of the code changed since
# main is covered, SonarQube Cloud's gate (scripts/new_code_coverage.py). Keep the ruff
# and mypy revs in step with requirements-dev.in.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      # The files and settings of mypy.ini, as make lint checks them, whatever is staged.
      - id: mypy
        args: []
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: plugin-index
        name: validate manifests and plugins.json
        entry: python3 scripts/plugin_index.py validate
        language: system
        files: ^(plugins/|plugins\.json$|Cargo\.toml$|scripts/plugin_index\.py$)
        pass_filenames: false
      # The staged Cargo.lock, not the working tree's: it must take the SDK from GitHub,
      # as CI builds it (make sdk-local's paths override leaves it so; a [patch] doesn't).
      - id: cargo-lock-sdk
        name: Cargo.lock takes the plugin SDK from GitHub
        entry: sh -c 'git show :Cargo.lock | python3 scripts/plugin_index.py check-lock -'
        language: system
        files: ^Cargo\.lock$
        pass_filenames: false
      # Every plugin, whatever is staged: it takes a few seconds (jscpd, through npx).
      - id: duplication
        name: no copied code within a plugin (jscpd)
        entry: make duplication
        language: system
        files: ^plugins/.*\.(rs|py)$
        pass_filenames: false
      # The tests, Python and Rust together: the gate on new code needs both reports up to
      # date. A plugin's tests also run when its manifest changes (tests/test_plugins.py
      # reads plugin.json).
      - id: coverage
        name: tests with coverage, 80% of new code
        entry: make coverage
        language: system
        files: ^((scripts|tests|plugins)/.*\.py|plugins/.*\.rs|plugins/.*/(plugin|Cargo)\.(json|toml)|Cargo\.(toml|lock)|\.coveragerc|sonar-project\.properties)$
        pass_filenames: false
