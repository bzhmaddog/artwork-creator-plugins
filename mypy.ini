# mypy, the type checker of the Python code (make lint). The code has few annotations, so
# this checks the bodies of unannotated functions too rather than requiring annotations
# (strict mode would).
[mypy]
python_version = 3.11
files = scripts, tests, plugins
# The tests import the scripts as top-level modules (tests/repo.py puts scripts/ on the path).
mypy_path = scripts
check_untyped_defs = True
strict_equality = True
extra_checks = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
warn_unreachable = True

# The app's Python SDK, which the Python plugins import, isn't installed here; the tests
# use a stand-in for it.
[mypy-artwork_plugin_sdk]
ignore_missing_imports = True

# The Python plugins' dependencies (their PEP 723 blocks): checked against their types when
# they're installed (CI installs them, see .github/workflows/ci.yml), skipped when they
# aren't (the pre-commit hook's own environment). Add a plugin's new dependency here.
[mypy-numpy.*]
ignore_missing_imports = True
