# SonarQube Cloud analysis, run by the Coverage job of .github/workflows/ci.yml (which
# makes the coverage reports first). Needs the SONAR_TOKEN secret, and Automatic Analysis
# turned off in the project (Administration > Analysis Method).
sonar.organization=bzhmaddog
sonar.projectKey=bzhmaddog_artwork-creator-plugins

# Everything tracked (git-ignored files, such as target/ and coverage/, are skipped), the
# workflows included; the tests count as tests, not as code.
sonar.sources=.
sonar.exclusions=tests/**,plugins/**/test_*.py,plugins/**/tests.rs
sonar.tests=tests,plugins
sonar.test.inclusions=tests/**,plugins/**/test_*.py,plugins/**/tests.rs

sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage/python.xml
sonar.rust.lcov.reportPaths=coverage/rust.lcov
