# The Rust plugins (one crate per folder of plugins/), built together so they share
# Cargo.lock. A new Rust plugin goes in `members` (a glob would also take the Python
# plugins' folders); CI checks none is missing. See "Releasing a plugin" in README.md.
[workspace]
resolver = "3"
members = ["plugins/halftone"]
# Each plugin takes the plugin SDK in its own Cargo.toml, from the Artwork Creator
# repository at a release tag, so it moves to a newer SDK (one that breaks its code, say)
# when it's ready, apart from the others. See "Moving to a newer app or SDK" in
# docs/publishing.md.
